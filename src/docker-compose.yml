name: ido-assistant

services:
  # ------------------------
  # Database
  # ------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend_net

  # --------------------------------------------------------
  # Backend (Django — DEV MODE, autoreload)
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app         # live code mount
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - frontend_net
      - backend_net
      - rag_net

  # --------------------------------------------------------
  # Frontend (Next.js + Tailwind — DEV MODE)
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    command: npm run dev       # hot reload
    depends_on:
      rag:
        condition: service_healthy
    env_file: .env
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app        # live code mount
      - /app/node_modules      # prevent overwriting installed deps
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - frontend_net

  # --------------------------------------------------------
  # RAG service (FastAPI/Flask — DEV MODE)
  # --------------------------------------------------------
  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: rag
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./rag:/rag             # live code mount
    env_file: .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      CHUNKING_STRATEGY: ${CHUNKING_STRATEGY:-entity-based}
      ASSISTANT_CORPUS_MODE: ${ASSISTANT_CORPUS_MODE:-full}
      CORPUS_FORMAT: ${CORPUS_FORMAT:-turtle}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - rag_net

volumes:
  pgdata:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  rag_net:
    driver: bridge
