  statement: "Every lis:SpatialLocation is a lis:Site."
  gold_label: contradicted
  licensing_axiom: [lis:Site, owl:disjointWith, lis:SpatialLocation]
  licensing_axiom_status: asserted
  annotation_prose_screen: neutral
  recoverability_profile:
    turtle: true
    elot-org: true
    elot-org-ancestors: true
    omn: true
    jsonld: true
    yaml-ld: true
    ofn: true
  notes: >
    Batch-01 candidate B-14. The direct Site/SpatialLocation disjointness axiom
    makes the asserted subclass statement unsatisfiable under the benchmark's
    contradicted-label convention. All seven formats directly recover the axiom.

